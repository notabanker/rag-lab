name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # pyproject.toml sets `[tool.uv] managed = false`, so `uv sync` refuses
      # to run here; install into an explicit venv instead (same shape as the
      # local workflow).
      - run: uv venv
      - run: uv pip install -e . pytest ruff
      - run: uv run pytest -q
      - run: uv run ruff check --select E9,F rag_lab tests
