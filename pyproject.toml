[project]
name = "rag-lab"
version = "3.1.0"
description = "Standalone RAG learning project"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rank-bm25>=0.2",
    "pypdf>=5.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "markdown-it-py>=3.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.5",
    "mcp>=1.0",
    "python-docx>=1.1",
]

[project.scripts]
rag = "rag_lab.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_lab"]

[tool.uv]
managed = false
